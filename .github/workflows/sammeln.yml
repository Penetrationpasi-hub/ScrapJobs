name: Arbeitgeber sammeln

on:
  schedule:
    # 03:20 UTC = 04:20 Winterzeit / 05:20 Sommerzeit
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Nur diese Quellen (kommagetrennt, z. B. stihl,kaercher); leer = alle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scrapling-server/requirements.txt

      - name: Abhängigkeiten
        run: pip install --disable-pip-version-check -r scrapling-server/requirements.txt pytest

      - name: Tests
        working-directory: scrapling-server
        run: python -m pytest -q

      - name: Sammeln
        working-directory: scrapling-server
        env:
          SCRAPJOBS_SOURCES: ${{ inputs.sources }}
        run: python batch.py --out ../stellen.json

      - name: Ergebnis committen
        run: |
          if git diff --quiet -- stellen.json && [ -z "$(git ls-files --others --exclude-standard stellen.json)" ]; then
            echo "Keine Änderung"; exit 0
          fi
          git config user.name "scrapjobs-bot"
          git config user.email "scrapjobs-bot@users.noreply.github.com"
          git add stellen.json
          git commit -m "Stellenkatalog $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
