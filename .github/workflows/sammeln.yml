name: Arbeitgeber sammeln

on:
  schedule:
    # GitHub startet geplante Laeufe oft Stunden spaeter als angegeben
    # (beobachtet: 04:05 UTC -> ca. 12-14 Uhr UTC). Deshalb keine
    # Uhrzeit-Pruefung mehr, sondern: einmal je Berliner Kalendertag.
    # Der zweite Termin ist Reserve, falls der erste ausfaellt.
    - cron: "5 4 * * *"
    - cron: "5 5 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Nur diese Quellen (kommagetrennt, z. B. stihl,kaercher); leer = alle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # Immer den aktuellen Stand des Branches holen, nicht den Commit vom
      # Zeitpunkt des Auslösens: ein wartender Lauf (concurrency) startet sonst
      # auf veraltetem stellen.json und kollidiert beim Push mit dem Vorlauf.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Heute schon gesammelt?
        id: zeit
        run: |
          heute=$(TZ=Europe/Berlin date +%F)
          stand=$(python3 -c "import json,datetime,zoneinfo; s=json.load(open('stellen.json')).get('aktualisiert') or ''; print(datetime.datetime.fromisoformat(s).astimezone(zoneinfo.ZoneInfo('Europe/Berlin')).date() if s else '')" 2>/dev/null || true)
          echo "Heute (Berlin): $heute, letzter Stand: ${stand:-unbekannt}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$stand" = "$heute" ]; then
            echo "Heute schon gesammelt, dieser Lauf wird übersprungen."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.zeit.outputs.go == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scrapling-server/requirements.txt

      - if: steps.zeit.outputs.go == 'true'
        name: Abhängigkeiten
        run: pip install --disable-pip-version-check -r scrapling-server/requirements.txt pytest openpyxl

      - if: steps.zeit.outputs.go == 'true'
        name: Tests
        working-directory: scrapling-server
        run: python -m pytest -q

      - if: steps.zeit.outputs.go == 'true'
        name: Sammeln
        working-directory: scrapling-server
        env:
          SCRAPJOBS_SOURCES: ${{ inputs.sources }}
        run: python batch.py --out ../stellen.json

      - if: steps.zeit.outputs.go == 'true'
        name: Excel
        working-directory: scrapling-server
        run: python excel.py ../stellen.json ../stellen.xlsx

      # !cancelled(): auch nach einem roten Sammeln speichern, was da ist
      # (die Historie laeufe.csv wird dann trotzdem fortgeschrieben).
      - if: ${{ !cancelled() && steps.zeit.outputs.go == 'true' }}
        name: Ergebnis committen
        run: |
          if git diff --quiet -- stellen.json STELLEN.md stellen.xlsx laeufe.csv && [ -z "$(git ls-files --others --exclude-standard stellen.json STELLEN.md stellen.xlsx laeufe.csv)" ]; then
            echo "Keine Änderung"; exit 0
          fi
          git config user.name "scrapjobs-bot"
          git config user.email "scrapjobs-bot@users.noreply.github.com"
          git add stellen.json STELLEN.md stellen.xlsx laeufe.csv
          git commit -m "Stellenkatalog $(date -u +%Y-%m-%d)"
          # Erzeugte Dateien: bei Konflikt gewinnt der frische Lauf (-X theirs
          # = der gerade wiedergegebene eigene Commit).
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Bewusst NACH dem Committen: die Daten sind gespeichert, rot ist nur das
      # Signal. Quellen ohne Stellen (ausser Ausnahmeliste) lassen den Lauf
      # fehlschlagen; die Tabelle steht oben in der Zusammenfassung des Laufs.
      - if: ${{ !cancelled() && steps.zeit.outputs.go == 'true' }}
        name: Quellen prüfen
        working-directory: scrapling-server
        run: python pruefen.py ../laeufe.csv ohne_stellen_ok.json
